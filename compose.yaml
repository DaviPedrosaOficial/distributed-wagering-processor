services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Crie o arquivo .env e defina POSTGRES_DB, assim como demonstrado no .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?Crie o arquivo .env e defina POSTGRES_USER, assim como demonstrado no .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crie o arquivo .env e defina POSTGRES_PASSWORD, assim como demonstrado no .env.example}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: