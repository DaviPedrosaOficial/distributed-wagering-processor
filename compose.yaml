services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Crie o arquivo .env e defina POSTGRES_DB, assim como demonstrado no .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?Crie o arquivo .env e defina POSTGRES_USER, assim como demonstrado no .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crie o arquivo .env e defina POSTGRES_PASSWORD, assim como demonstrado no .env.example}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data: